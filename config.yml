# DeathMessagesPrime Configuration File
# SAVE THIS FILE AS UTF-8!!!! (without BOM)
# Your text editor should support it. (Windows Notepad does probably not work)

# World groups.
# If a world is in a group, and a death occurs there, the appropriate death 
# message will be shown in rest of the worlds in that same group too.
# 
# If _enabled is false, this feature is disabled. Instead, the death message 
# behavior will be specified with per-world-messages.
#
# per-world-messages must be enabled to make world-groups work!
world-groups:
  _enabled: true
  "1":
    - world
    - world_nether
    - world_the_end
  
# Following players will never have visible death messages.
# The list is UUID-based.
# Default: (empty)
player-blacklist: 
# - '00000000-0000-0000-0000-000000000000'
  
# List worlds, where death messages from PvP are not recorded, here.
# Default: (empty)
worlds-no-pvp-death-messages:
  - someDisabledWorld1
  - someOtherDisabledWorld

# List worlds, where death messages from anything else than PvP are not 
# recorded, here.
# Default: (empty)
worlds-no-natural-death-messages:
  - someDisabledWorld1
  - someOtherDisabledWorld

# List worlds, where death messages are only shown to the killer and the 
# victim, here.
# Default: (empty)
worlds-private-pvp-death-messages:
# - world3

# List worlds, where death messages are only shown to the victim that died here.
# Default: (empty)
worlds-private-natural-death-messages:
# - world3

# Worlds with maximum radius (in blocks) for death messages, assumed infinite 
# if world is not present.
# Should a world have a death message radius, the messages will never be shown 
# to players in any other world.
worlds-death-message-radius:
    #world: 10 

# Similar to the above, but this only controls PVP messages (not natural
# death messages). If both are set, the above worlds-death-message-radius
# will affect the natural messages and this one will affect the PVP messages.
# In order to only have a PVP message radius: add the world here only.
# In order to only have a natural message radius: add the world under
# both options and set it to -1 here.
worlds-pvp-death-message-radius:
    #world: 10 
    
# Show death messages in all worlds, if false. Needs to be true in order to 
# worldgroups to function.
# Default: true
per-world-messages: false

# If disabled, mobs will always go by their type (see mob-names), ignoring
# custom names. Players are not affected.
# Default: true
death-message-enable-namedmob: true

# The color of death messages, and optionally of the names of players and mobs
# in them, so that messages don't have to style every name by hand.
# These take a color name (red) or a hex color ("#ff5555").
# Mind the quotes: without them, YAML takes a hex color for a comment.
# Set base-color to "" to leave messages uncolored.
# Colors within a message still apply to its text, but a name always gets
# name-color, if set, unless it comes with a color of its own.
base-color: "red"
name-color: "gold"

# Broadcast death message to console.
# none: Do not print death message in console.
# normal: Print the DeathMessagesPrime message in console.
# Default: normal
console-death-message: normal

# Clean colors from messages printed in the console, 
# ignored if console-death-message is not normal
# Default: false
console-death-message-strip-colors: false

# Displays the death message in the console even if the world has disabled
# death messages or set them to private. 
# Default: true
console-death-message-even-if-disabled: true

# If enabled, weapon kills will default to the given key if the weapon has no
# custom name. If ignore-enchantments is false, enchanted weapons still count.
disable-weapon-kill-with-no-custom-name:
  enabled: true
  ignore-enchantments: true
  projectile-default-to: Projectile-Unknown
  weapon-default-to: Melee

# Items that count as weapons, on top of tools and the like.
# The first one takes regular expressions, to be matched against display names
# (as MiniMessage, see below), the second one takes material names.
custom-item-display-names-is-weapon:
# - '<gold>SUPER\sCOOL\sGOLDEN\sAPPLE'
custom-item-material-is-weapon:
# - ACACIA_FENCE

# If no message is defined for a death with a killer, for example for being
# pushed into the void, use the one from Natural-Cause.
# Default: true
default-natural-death-not-defined: true

# Same, but use the melee message instead. Only has an effect if the above
# is disabled.
# Default: true
default-melee-last-damage-not-defined: true

# Seconds before a damager stops being held responsible for a death.
# Default: 7
expire-last-damage: 7

# If enabled, dying to the ender dragon's breath uses Natural-Cause.Dragon-Breath
# instead of Natural-Cause.Melee.
# Default: false
fix-mc-84595: true

# Deaths following these commands use Natural-Cause.Suicide, whatever the
# actual cause was. For those who use commands to end themselves.
custom-suicide-commands:
  - "/kill"

# Custom messages take the priority over the ones further down. For a given
# death, they are looked up with the same keys as the regular ones, which is
# what the examples below show. A "*" key covers every death.
#
# If several sections have a message for the same key, the one with the highest
# priority wins. It is 1 unless a section sets its own, like this:
#   custom-messages-per-world:
#     priority: 5

custom-messages-per-victim:
  # Use the UUID as the key.

  # "123e4567-e89b-12d3-a456-426655440000":
  #   Natural-Cause:
  #     TNT:
  #       - "A VIP victim, <player>, blew up!"

  # "123e4567-e89b-12d3-a456-426655440000":
  #   "*":
  #     - "A VIP victim, <player>, died!"

custom-messages-per-killer-player:
  # Same as above, but for killing players.

  # "123e4567-e89b-12d3-a456-426655440000":
  #   Mobs:
  #     player:
  #       Solo:
  #         TNT:
  #           - "<player> got blown up by a VIP killer, <killer>!"

custom-messages-per-weapon-name:
  # Same as above, but for weapon names (as MiniMessage, see below).

  # "<gold>Super Duper Sword":
  #   Mobs:
  #     player:
  #       Solo:
  #         Weapon:
  #           - "<player> was slain by <killer> using the mightiest weapon of all"

custom-messages-per-weapon-type:
  # Same as above, but for weapon materials.

  # IRON_SWORD:
  #   Mobs:
  #     player:
  #       Solo:
  #         Weapon:
  #           - "<player> was slain by <killer> using an iron sword"

custom-messages-per-world:
  # Same as above, but for world names.

  # "world":
  #   Natural-Cause:
  #     TNT:
  #       - "A victim, <player>, blew up in the specific world!"

custom-messages-per-mob-name:
  # Same as above, but for mob names (as MiniMessage, see below).

# >>> MESSAGES
# Everything from this line on comes from the DeathMessages plugin, and can be
# replaced with the files of an existing installation. See the README.
# Their color codes and placeholders must be converted, or they will show up as text.
#
# Messages, mob-names and mob-plurals use MiniMessage for their formatting:
# https://docs.papermc.io/adventure/minimessage/format/
# To show a literal tag, escape it with a backslash: \\<red> within double quotes,
# \<red> otherwise.
#
# Weapon and mob names are compared as MiniMessage in their shortest form, without
# closing tags at the end, such as <gold>Super Sword. Those set by other plugins
# often start with <!italic>.
#
# Placeholders, which are tags like any other:
# <player> - the player's name
# <player_display> - the player's display name
# <killer> - the killer's name. If it has no name, it will be its type.
#   In Gang messages, it is always the plural of its type, from mob-plurals, and
#   <killer_name> and <killer_type> are there for the singular forms.
# <killer_display> - if the killer is a player, their display name, otherwise <killer>
# <killer_type> - the killer's type, from mob-names
# <weapon> - the weapon's name, with a tooltip of the item
# <block> - the block that fell on the player, from Blocks (Falling-Block only)
# <climbable> - what the player fell off of, from Blocks (Climbable keys only)
# <biome> - the name of the biome the player died in
# <world> - the name of the world the player died in
# <world_environment> - the environment of that world, from Environment
# <x>, <y>, <z> - the coordinates the player died at
# <distance> - the distance between the player and the killer, in blocks
# <victim_xp>, <victim_level> - the XP and level of the player
# <killer_xp>, <killer_level> - the XP and level of the killer, if a player
# <victim_name>, <victim_tag>, <killer_name>, <killer_tag>, <weapon_name> and
# <weapon_tag> also work, and are the same as their counterparts above, except
# for <killer_name> in Gang messages: it is the name of the one who got the kill.
#
# A message using <weapon>, <block> or <climbable> is skipped if they are not
# known for a given death, which leaves it to the next one in line.
#
# Tooltips and click actions use MiniMessage's <hover> and <click> tags.
# "<player> was killed by <hover:show_text:'<red>Location: <x> <y> <z>'><killer></hover>"
# Placeholders work in <hover>, but not in the argument of <click>.
#
# Conditions:
# Starting a message with PERMISSION[node] or PERMISSION_KILLER[node] restricts
# it to deaths where the player or the killer have that permission.
# REGION[name] needs WorldGuard, which is not supported: such messages are skipped.
#
# How a message is picked for a death:
# - If there is a mob or player to blame, Mobs.<type>.<Solo or Gang>.<cause>,
#   then Mobs.player.<Solo or Gang>.<cause>, then Natural-Cause.<cause>.
#   See default-natural-death-not-defined and default-melee-last-damage-not-defined.
# - If not, Natural-Cause.<cause>, then Natural-Cause.Unknown.
# - Falls off something climbable try a key for that block first, then, with no
#   killer, Climbable. Those are Climbable-Ladder, Climbable-Vine,
#   Climbable-Weeping-Vines, Climbable-Twisting-Vines, Climbable-Cave-Vines,
#   Climbable-Scaffolding and Climbable-Trapdoor. With a killer, they are looked
#   up like any other cause, in Mobs, before moving on to Fall.
# - Gang is used when at least Gang.Mobs.<type>.Amount entities of the killer's
#   type are within Gang.Mobs.<type>.Radius blocks of the player.
#
# To completely remove the message for a certain death, set it to [], such as:
#   Natural-Cause:
#     Bed: []

# Ignores everything in the Mobs section and makes all messages appear the same.
